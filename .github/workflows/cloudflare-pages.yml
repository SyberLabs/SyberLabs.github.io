name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syberlabs-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check shared header and footer
        run: node scripts/site-chrome.mjs --check
      - name: Prepare public site
        run: |
          pnpm build:site
          test -s dist/index.html
          test -s dist/syberlabs.css
          test -s dist/syberlabs.js
          test -s dist/system-map.js
          for project in rise omnios relay osahr; do grep -Fq "data-system-map=\"$project\"" "dist/projects/$project/index.html"; done
          grep -Fq 'pj-run__out' dist/projects/syberwork/index.html
          grep -Fq 'sy-atlas' dist/index.html
          grep -Fq 'syberlabs.js' dist/services/index.html
          test -s dist/404.html
          test -s dist/rise-demo/index.html
          test -s dist/rise-demo/rise-marketing-20260929-v3.mp4
          test -s dist/rise-demo/rise-marketing-20260929-v3-poster.jpg
          test "$(stat -c%s dist/rise-demo/rise-marketing-20260929-v3.mp4)" -lt 26214400
          grep -Fq '/rise-demo/rise-marketing-20260929-v3.mp4' dist/rise-demo/index.html
          test ! -e dist/commons
          test ! -e dist/projects/commons
          grep -Fq 'https://omni.syberlabs.io/' dist/index.html
          grep -Fq 'https://omni.syberlabs.io/' dist/projects/omnios/index.html
          grep -Fq 'https://rise.syberlabs.io/' dist/projects/rise/index.html
          grep -Fq '/rise-demo/rise-marketing-20260929-v3.mp4' dist/projects/rise/index.html
          grep -Fq 'pj-evidence' dist/projects/rise/index.html
          test -s dist/omni-demo/omnios-morning-20261005.mp4
          test -s dist/omni-demo/omnios-morning-20261005-poster.jpg
          test "$(stat -c%s dist/omni-demo/omnios-morning-20261005.mp4)" -lt 8388608
          grep -Fq '/omni-demo/omnios-morning-20261005.mp4' dist/projects/omnios/index.html
          test -s dist/relay-demo/relay-runtime-20261005.jpg
          grep -Fq '/relay-demo/relay-runtime-20261005.jpg' dist/projects/relay/index.html
          ! grep -Fq 'rise:sections' dist/projects/rise/index.html
          test -s dist/approach/index.html
          test -s dist/jev/index.html
          test -s dist/research/jev-execution/index.html
          test -s dist/research/jev-execution/report.css
          test -s dist/research/sybershoke/index.html
          test -s dist/research/sybershoke/report.css
          test -s dist/services/index.html
          test -s dist/services/services.css
          test -s dist/privacy/index.html
          for project in rise omnios syberwork relay osahr; do test -s "dist/projects/$project/index.html"; done
          grep -Fxq '/rise https://rise.syberlabs.io/ 301' dist/_redirects
          grep -Fxq '/rise/* https://rise.syberlabs.io/:splat 301' dist/_redirects
          grep -Fxq '/projects/commons/* / 301' dist/_redirects
          grep -Fxq '/omni https://omni.syberlabs.io/ 301' dist/_redirects
          grep -Fq 'class="sy-header' dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4.141.0 pages deploy dist --project-name=syberlabs-home --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: 1080d513988ebb38f832ce7cbea7ab1d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
