name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syberlabs-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public site
        run: |
          mkdir dist
          cp index.html robots.txt sitemap.xml site.webmanifest _redirects \
            syber-mark.png og-image.png mateo_robles_resume.pdf \
            favicon.ico favicon-32x32.png favicon-16x16.png \
            apple-touch-icon.png android-chrome-192x192.png \
            android-chrome-512x512.png dist/
          test -s dist/index.html
          grep -Fxq '/rise https://rise.syberlabs.io/ 301' dist/_redirects
          grep -Fxq '/rise/* https://rise.syberlabs.io/:splat 301' dist/_redirects
      - uses: actions/upload-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4.141.0 pages deploy dist --project-name=syberlabs-home --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: 1080d513988ebb38f832ce7cbea7ab1d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
