name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push→push on main and PR→PR on a branch still supersede each other, but a manual dispatch
  # neither cancels nor is cancelled by a queued push run for the same ref. On 2026-10-05, during a
  # GitHub-hosted-runner incident, dispatch run #184 cancelled push run #183 two seconds after it was
  # queued; the push would have deployed on its own. Two manual runs queue rather than kill each other.
  group: syberlabs-home-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Public account navigation tests
        run: node --test scripts/account-nav.test.mjs
      - name: Staff sign-in tests
        # Quoted glob: `node --test server/` does not find them. The PR pastes the reported pass count.
        run: node --test 'server/test/**/*.test.js'
      - name: Check shared header and footer
        run: node scripts/site-chrome.mjs --check
      - name: GitHits dependency snapshot
        # Fail soft: without the secret this writes the fixture schema; GitHits never blocks a build.
        # Targets follow each project's default-branch head; if GitHub is unreachable the committed
        # targets.json is used as is.
        run: |
          node scripts/githits-snapshot.mjs --targets || echo "githits: keeping committed targets.json"
          node scripts/githits-snapshot.mjs
        continue-on-error: true
        env:
          GITHITS_API_TOKEN: ${{ secrets.GITHITS_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the Decision Arena report and replay match their recorded hashes
        run: node scripts/export-arena.mjs --check
      - name: Prepare public site
        run: |
          pnpm build:site
          test -s dist/index.html
          test -s dist/syberlabs.css
          test -s dist/syberlabs.js
          test -s dist/system-map.js
          for pair in rise:rise flyspace:omnios relay:relay osahr:osahr; do grep -Fq "data-system-map=\"${pair##*:}\"" "dist/projects/${pair%%:*}/index.html"; done
          grep -Fq 'pj-run__out' dist/projects/syberwork/index.html
          grep -Fq 'sy-atlas' dist/index.html
          grep -Fq 'https://rise.syberlabs.io/try/' dist/index.html
          grep -Fq 'id="dependencies"' dist/stack/index.html
          grep -Fq 'rise.syberlabs.io<wbr>/api/mcp' dist/projects/rise/index.html
          grep -Fq 'syberlabs.js' dist/services/index.html
          test -s dist/404.html
          test -s dist/rise-demo/index.html
          test -s dist/rise-demo/rise-marketing-20260929-v3.mp4
          test -s dist/rise-demo/rise-marketing-20260929-v3-poster.jpg
          test "$(stat -c%s dist/rise-demo/rise-marketing-20260929-v3.mp4)" -lt 26214400
          grep -Fq '/rise-demo/rise-marketing-20260929-v3.mp4' dist/rise-demo/index.html
          test ! -e dist/commons
          test ! -e dist/projects/commons
          grep -Fq 'https://omni.syberlabs.io/' dist/index.html
          grep -Fq 'https://omni.syberlabs.io/' dist/projects/flyspace/index.html
          grep -Fq 'https://rise.syberlabs.io/' dist/projects/rise/index.html
          grep -Fq '/rise-demo/rise-marketing-20260929-v3.mp4' dist/projects/rise/index.html
          grep -Fq 'pj-evidence' dist/projects/rise/index.html
          grep -Fq 'pj-gallery' dist/projects/rise/index.html
          test -s dist/rise-demo/rooms/rise-home-20261005.webp
          grep -Fq '/rise-demo/rooms/rise-home-20261005.webp' dist/projects/rise/index.html
          test -s dist/rise-demo/rooms/rise-rooms-begin-20261005.mp4
          test "$(stat -c%s dist/rise-demo/rooms/rise-rooms-begin-20261005.mp4)" -lt 8388608
          test -s dist/omni-demo/omnios-morning-20261005.mp4
          test -s dist/omni-demo/omnios-morning-20261005-poster.jpg
          test "$(stat -c%s dist/omni-demo/omnios-morning-20261005.mp4)" -lt 8388608
          grep -Fq '/omni-demo/omnios-morning-20261005.mp4' dist/projects/flyspace/index.html
          test -s dist/relay-demo/relay-runtime-20261005.jpg
          grep -Fq '/relay-demo/relay-runtime-20261005.jpg' dist/projects/relay/index.html
          # Absence guards use `if ...; then exit 1; fi`: bash -e ignores a failing `!`-negated command, so `! grep` never fails a step.
          if grep -Fq 'rise:sections' dist/projects/rise/index.html; then echo 'rise:sections leaked into dist/projects/rise/index.html'; exit 1; fi
          # "What changed" is staff-only (MasterMind RFC 0002): no raw data file, no rows or heading note in any page or script.
          test ! -e dist/projects/latest.js
          if grep -rqF 'home-latest__row' dist --include='*.html' --include='*.js'; then echo 'What changed leaked: row markup in dist/'; exit 1; fi
          if grep -rqF 'Each line links to its evidence' dist --include='*.html' --include='*.js'; then echo 'What changed leaked: section copy in dist/'; exit 1; fi
          if grep -rqF 'Capability engine security close' dist; then echo 'What changed leaked: canary entry'; exit 1; fi
          test -s dist/approach/index.html
          test -s dist/jev/index.html
          test -s dist/research/index.html
          test -s dist/research/research.css
          test -s dist/research/jev-execution/index.html
          test -s dist/research/jev-execution/report.css
          test -s dist/research/sybershoke/index.html
          test -s dist/research/sybershoke/report.css
          test -s dist/research/decision-arena/index.html
          test -s dist/research/decision-arena/arena.js
          test -s dist/research/decision-arena/data/report.json
          test -s dist/research/decision-arena/data/replay.json
          test -s dist/services/index.html
          test -s dist/services/services.css
          test -s dist/privacy/index.html
          test -s dist/plus/index.html
          test -s dist/plus/plus.css
          test -s dist/review/index.html
          test -s dist/review/review.css
          test -s dist/review/2026-10-08/index.html
          grep -Fq 'No payment is taken on this page' dist/plus/index.html
          for project in rise flyspace syberwork relay osahr; do test -s "dist/projects/$project/index.html"; done
          test -s dist/og/flyspace.png
          grep -Fq 'og:image' dist/projects/flyspace/index.html
          test ! -e dist/projects/omnios
          grep -Fxq '/projects/omnios/* /projects/flyspace/:splat 301' dist/_redirects
          grep -Fxq '/rise https://rise.syberlabs.io/ 301' dist/_redirects
          grep -Fxq '/rise/* https://rise.syberlabs.io/:splat 301' dist/_redirects
          grep -Fxq '/projects/commons/* / 301' dist/_redirects
          grep -Fxq '/omni https://omni.syberlabs.io/ 301' dist/_redirects
          grep -Fq 'class="sy-header' dist/404.html
          test ! -e dist/admin
          test ! -e dist/auth
          test ! -e dist/api
          test -s dist/staff.css
          test -s dist/staff/google-signin-dark-360.png
          test -s dist/staff/google-signin-dark-540.png
          test -s dist/staff/google-signin-dark-720.png
      - name: Build and check the staff Function
        # Negative guards use `if ...; then exit 1; fi`: bash -e ignores a failing `! cmd` (RFC-0002 8.3).
        # The Function is built here, by the lockfile-pinned wrangler the deploy job also uses (RFC-0002 D12),
        # and deployed as is (--no-bundle), so production runs the tested bundle. No token in this job.
        run: |
          npm ci --prefix deploy
          deploy/node_modules/.bin/wrangler pages functions build --outdir dist/_worker.js --compatibility-date 2026-10-01
          test -s dist/_worker.js/index.js
          grep -Fq '"/admin/*"' dist/_routes.json
          if grep -Fq '"/*"' dist/_routes.json; then echo 'routes too wide'; exit 1; fi
          if grep -rqF 'GOCSPX-' dist; then echo 'Google client secret in dist'; exit 1; fi
          if grep -REiq '(INSERT|REPLACE)([[:space:]]+OR[[:space:]]+[A-Z]+)?[[:space:]]+INTO[[:space:]]+["`[]?(main\.)?(users|identities|invites|user_roles|sessions|change_entries)' migrations/; then echo 'people in migrations'; exit 1; fi
          if grep -Eq '@|[0-9]{6,}' migrations/*.sql; then echo 'email or provider id in migrations'; exit 1; fi
          if grep -rqiE "<script[^>]+src=[\"']?(https?:)?//" dist --include='*.html'; then echo 'third-party script on a public page'; exit 1; fi
          if grep -rqiE "<link[^>]+rel=[\"']?modulepreload[^>]+href=[\"']?(https?:)?//" dist --include='*.html'; then echo 'third-party modulepreload'; exit 1; fi
      - name: Quality sweep of the built site
        run: node scripts/qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          # artifacts on a public repo can be downloaded by any signed-in GitHub user; keep them only as long as a deploy needs
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          # The deploy job has no checkout: it gets the Pages config and its locked deploy tools from here.
          name: pages-config-${{ github.sha }}
          path: |
            wrangler.toml
            deploy/package.json
            deploy/package-lock.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: pages-config-${{ github.sha }}
          path: .
      - name: Install the pinned wrangler
        # No Cloudflare token in this step's environment (RFC-0002 8.3). --ignore-scripts goes one step
        # further than the RFC: no install script runs in a job that will hold the token.
        run: npm ci --prefix deploy --ignore-scripts
      - name: Publish to Cloudflare Pages
        # wrangler comes from the committed lockfile, not npx (RFC-0002 D12). --no-bundle ships
        # dist/_worker.js exactly as the validate job built and tested it.
        run: deploy/node_modules/.bin/wrangler pages deploy dist --project-name=syberlabs-home --branch=main --no-bundle
        env:
          CLOUDFLARE_ACCOUNT_ID: 1080d513988ebb38f832ce7cbea7ab1d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
