name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syberlabs-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare public site
        run: |
          pnpm build
          cp robots.txt sitemap.xml site.webmanifest _redirects \
            syber-mark.png og-image.png mateo_robles_resume.pdf \
            favicon.ico favicon-32x32.png favicon-16x16.png \
            favicon-blue.ico favicon-blue-32x32.png favicon-blue-16x16.png \
            apple-touch-icon.png android-chrome-192x192.png \
            android-chrome-512x512.png dist/
          cp -r rise-demo dist/
          cp -r projects dist/
          cp -r commons dist/
          cp -r approach dist/
          cp -r jev dist/
          test -s dist/index.html
          test -s dist/rise-demo/index.html
          test -s dist/rise-demo/rise-demo-20260926.mp4
          test -s dist/commons/index.html
          test -s dist/approach/index.html
          test -s dist/jev/index.html
          for project in rise commons relay omnios osahr; do test -s "dist/projects/$project/index.html"; done
          grep -Fxq '/rise https://rise.syberlabs.io/ 301' dist/_redirects
          grep -Fxq '/rise/* https://rise.syberlabs.io/:splat 301' dist/_redirects
          grep -Fxq '/projects/commons /commons/ 301' dist/_redirects
          grep -Fxq '/projects/commons/* /commons/:splat 301' dist/_redirects
      - uses: actions/upload-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: syberlabs-home-${{ github.sha }}
          path: dist/
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4.141.0 pages deploy dist --project-name=syberlabs-home --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: 1080d513988ebb38f832ce7cbea7ab1d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
