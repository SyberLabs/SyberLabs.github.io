    <h1 class="elan-name">Elan</h1>
    <canvas class="elan-view" data-visual="elan" role="img" aria-label="Loose dots drift, then dock one by one into a branching figure in which each finished strand forks into two. The view starts close and draws back as the figure grows. The figure lights, lets go and builds again in another form. A press lets it go early."></canvas>
