<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06051a">
  <link rel="icon" href="/favicon-32x32.png?v=prism" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/syberlabs.css?v=2">
  <title>Page not found — SyberLabs</title>
  <style>
    .nf { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; min-height: 100svh; }
    .nf main { position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; gap: var(--space-5); max-width: var(--sy-max); margin: 0 auto; padding: var(--space-9) var(--gutter); }
    .nf main .sy-actions { margin-top: var(--space-3); }
    .nf .sy-lockup { align-self: flex-start; }
  </style>
</head>
<body>
  <div class="nf sy-nebula--center">
    <canvas class="sy-atmosphere" id="plate" aria-hidden="true"></canvas>
    <div class="sy-scrim sy-scrim--heavy" aria-hidden="true"></div>
    <main>
      <a class="sy-lockup" href="/" aria-label="SyberLabs home"><img src="/syber-logo-96.png" alt="" width="22" height="24">SYBERLABS</a>
      <h1 class="sy-display">Page not found.</h1>
      <p class="sy-body-lg">The page you requested does not exist or has moved.</p>
      <div class="sy-actions"><a class="sy-btn sy-btn--solid" href="/">Go to the homepage</a></div>
    </main>
  </div>
  <script type="module">import { mount } from '/kit/v2/syber-atmosphere.js'; mount(document.getElementById('plate'), { mode: 'ambient' });</script>
</body>
</html>
