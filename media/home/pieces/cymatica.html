<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Cymatica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cymatica: sound made visible. A virtual Chladni plate driven by the music, where every note sets its own resonance figure and every hit strikes the plate.">
<style>
  /* Layout: a lab bench at night. The plate owns the center; the instrument readout sits top right like a meter. */
  :root{
    --ground:#04050a;
    --plate:#080a10;
    --ink:#e6eaf1;
    --ink-dim:#8791a2;
    --accent:#a6dbea;
    --line:rgba(166,219,234,.22);
    --panel:rgba(7,9,14,.72);
    --display:"Syne","Avenir Next","Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  html,body{height:100%;background:var(--ground);color:var(--ink);overflow:hidden;}
  body{font-family:var(--mono);-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;}

  .chrome{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));transition:opacity .4s;}
  .chrome.off{opacity:0;}
  .chrome.off *{pointer-events:none!important;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .brand{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.4vw,52px);letter-spacing:-.01em;line-height:.95;margin:.12em 0 0;text-wrap:balance;}
  .sub{font-size:10px;letter-spacing:.08em;color:var(--ink-dim);margin-top:8px;max-width:30ch;line-height:1.6;}

  .meter{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right;font-variant-numeric:tabular-nums;}
  .note{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,54px);line-height:.9;letter-spacing:-.01em;}
  .note small{font-size:.45em;color:var(--ink-dim);font-weight:500;margin-left:.2em;}
  .read{font-size:10.5px;letter-spacing:.06em;color:var(--ink-dim);line-height:1.6;}
  .read b{color:var(--ink);font-weight:400;}
  .hits{display:flex;gap:6px;margin-top:2px;}
  .hits span{--on:0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:3px 6px;border:1px solid var(--line);
    background:color-mix(in srgb,var(--accent) calc(var(--on)*85%),transparent);
    color:color-mix(in srgb,#061015 calc(var(--on)*100%),var(--ink-dim));}

  .bottom{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .bar{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:100%;
    background:var(--panel);border:1px solid var(--line);padding:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--ink);
    border:1px solid var(--line);padding:10px 12px;min-height:38px;cursor:pointer;transition:border-color .15s,background .15s,color .15s;}
  button:hover{border-color:var(--accent);}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#061015;font-weight:600;}
  button.primary:hover{background:#c3e9f3;}
  button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);}
  .glow{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);
    border:1px solid var(--line);padding:0 10px;min-height:38px;}
  .glow input{-webkit-appearance:none;appearance:none;width:84px;height:2px;background:var(--line);margin:0;}
  .glow input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--ground);cursor:pointer;}
  .glow input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--ground);cursor:pointer;}
  .hint{font-size:9.5px;letter-spacing:.08em;color:var(--ink-dim);text-align:center;}
  .hint kbd{font-family:var(--mono);color:var(--ink);border:1px solid var(--line);padding:0 4px;}
  .toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));
    font-size:11px;line-height:1.6;background:var(--panel);border:1px solid var(--line);padding:10px 14px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.on{opacity:1;}
  .drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,5,10,.6);
    font-family:var(--display);font-size:clamp(22px,4vw,38px);color:var(--accent);opacity:0;pointer-events:none;transition:opacity .2s;}
  .drop.on{opacity:1;}
  @media (max-width:560px){
    .meter{align-items:flex-start;text-align:left;}
    .sub,.hint{display:none;}
    button{padding:9px 9px;font-size:10px;letter-spacing:.08em;}
  }
</style>

<meta name="robots" content="noindex">
<style id="syb-embed">#chrome,#toast,#drop{display:none!important}html,body{overflow:hidden}
#syb-sound{position:fixed;right:10px;bottom:10px;z-index:99;min-height:44px;padding:0 13px;border:1px solid rgba(140,200,235,.3);border-radius:2px;background:rgba(2,7,10,.6);color:#c3cfd6;font:500 10px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#syb-sound[aria-pressed=true]{color:#fd9273;border-color:#fc734d}</style></head>
<body>
<canvas id="stage" aria-label="Cymatica: a Chladni plate driven by music"></canvas>
<div class="chrome" id="chrome">
  <div class="top">
    <div>
      <div class="brand">SyberLabs · Engines</div>
      <h1>Cymatica</h1>
      <div class="sub">A plate set ringing by the music. Each note sets its own figure. Each hit strikes the plate.</div>
    </div>
    <div class="meter" aria-live="off">
      <div class="note" id="note">A2<small>110.0 Hz</small></div>
      <div class="read" id="read">MODE <b>(5,2)</b></div>
      <div class="read" id="voices">&nbsp;</div>
      <div class="read" id="src">SOURCE <b>Idle example</b></div>
      <div class="hits" aria-hidden="true"><span id="ind-kick">Kick</span><span id="ind-snare">Snare</span><span id="ind-hat">Hats</span></div>
    </div>
  </div>
  <div class="bottom">
    <div class="bar" role="toolbar" aria-label="Sound">
      <button class="primary" id="btnDemo" type="button">Play demo</button>
      <button id="btnFile" type="button">Load track</button>
      <button id="btnMic" type="button">Mic</button>
      <label class="glow" for="glow">Glow <input type="range" id="glow" min="0.2" max="1.2" step="0.05" value="0.65"></label>
      <button id="btnFull" type="button">Full</button>
      <button id="btnHide" type="button">Hide</button>
    </div>
    <div class="hint">Drop an audio file anywhere · <kbd>Space</kbd> play or stop · <kbd>[</kbd> <kbd>]</kbd> glow · <kbd>H</kbd> hide · <kbd>F</kbd> fullscreen</div>
  </div>
</div>
<input type="file" id="file" accept="audio/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop" id="drop">Release to play</div>

<script>/* shared/audio-reactive.js, inlined by tools/bundle.mjs */
/*
 * SyberLabs audio-reactive base, shared by every piece in this repo.
 *
 * A piece supplies its visuals, its own analysis and its demo track. This base supplies the rest:
 *   - the audio graph: demo, file and mic sources, named analysers, and a look-ahead delay so
 *     visuals land on the sound (the speakers hear everything `lookahead` seconds after the analysers)
 *   - kick, snare and hat detection, with hits queued to fire on the sound
 *   - drum synths for demo tracks
 *   - noteTracker (which notes are sounding) and levelMeter (how hard the music is pushing)
 *   - the standard controls, by element id: btnDemo, btnFile, file, btnMic, btnFull, btnHide,
 *     glow, chrome, toast, drop, ind-kick, ind-snare, ind-hat (any can be left out)
 *   - a frame loop that survives a bad frame
 *   - offline rendering: with ?offline=1 the page is driven frame by frame by render/ (see
 *     window.AudioReactivePage below), randomness is seeded from ?seed=, and analysers are fed
 *     data computed in Node exactly as an AnalyserNode would compute it
 *
 * Usage, in a piece:
 *   const R = AudioReactive.create({
 *     name: "cymatica",                          // storage key prefix
 *     canvas,                                     // what offline capture records
 *     analysers: { tone: {fftSize:4096, smoothing:0.25, needs:["freq"], lead:0.07} },
 *     onsets: true,                               // built-in kick/snare/hat detection
 *     lookahead: 0.1,
 *     demo: (actx, dest, kit, R) => ({ stop(){} }),
 *     onHit: (name, strength, now) => {},         // fired on the sound
 *     step: (now, dt) => {},                      // every frame
 *   });
 *   R.mode is "idle" | "demo" | "file" | "mic"; R.an.tone is an AnalyserNode (or its offline stand-in).
 */
(function () {
  "use strict";
  const QS = new URLSearchParams(location.search);
  const OFFLINE = QS.get("offline") === "1";

  // ---------- seeded randomness ----------
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return h >>> 0; };
  }
  function mulberry32(a) {
    return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  // offline renders must be repeatable, so every Math.random in the page is seeded before any piece code runs
  if (OFFLINE) Math.random = mulberry32(xmur3("ar|" + (QS.get("seed") || "SYBER"))());

  // ---------- small helpers every piece uses ----------
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const fract = (x) => x - Math.floor(x);
  // soft ceiling: linear near zero, never exceeds max
  const soft = (x, max) => (max <= 0 ? 0 : max * (1 - Math.exp(-Math.max(0, x) / max)));
  const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const noteName = (m) => NOTE[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const esc = (s) => String(s).replace(/[<>&"]/g, (m) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[m]));

  // ---------- drum synths for demo tracks ----------
  function drumKit(actx, dest) {
    const noise = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const env = (g, t, a, peak, rel) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + rel); };
    return {
      noise, env,
      kick(t, v = 1) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); env(g, t, 0.004, v, 0.4); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.5); },
      snare(t, v = 0.4) {
        const s = actx.createBufferSource(); s.buffer = noise; const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 0.7;
        const g = actx.createGain(); env(g, t, 0.002, v, 0.17); s.connect(bp); bp.connect(g); g.connect(dest); s.start(t); s.stop(t + 0.25);
        const o = actx.createOscillator(), og = actx.createGain(); o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.08);
        env(og, t, 0.002, v * 0.6, 0.1); o.connect(og); og.connect(dest); o.start(t); o.stop(t + 0.15);
      },
      hat(t, v = 0.1) { const s = actx.createBufferSource(); s.buffer = noise; const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7500; const g = actx.createGain(); env(g, t, 0.002, v, 0.06); s.connect(hp); hp.connect(g); g.connect(dest); s.start(t); s.stop(t + 0.1); },
    };
  }
  // a step sequencer clock: calls schedule(n, t) for every step, slightly ahead of time
  function sequencer(actx, stepSeconds, schedule) {
    let n = 0, next = actx.currentTime + 0.12;
    const timer = setInterval(() => { while (next < actx.currentTime + 0.15) { schedule(n, next); next += stepSeconds; n++; } }, 25);
    return () => clearInterval(timer);
  }

  // ---------- kick / snare / hat detection ----------
  // One detector per instrument class, each against its own rolling mean + k*sd, fired on the rising edge.
  // Kick: loudness jump in the sub band, gated by real low-end level.
  // Snare and hats: broadband noise, measured as the share of bins in the band that jump at once, so tonal
  // notes (which light only a few bins) do not count; mid-heavy bursts are snares, top-heavy are hats.
  function onsetDetector(an, sampleRate, emit) {
    const DET = {
      kick: { type: "flux", lo: 40, hi: 130, gate: 150, k: 1.4, floor: 8, ref: 150 },
      snare: { type: "frac", lo: 1400, hi: 6000, jump: 15, gate: 55, k: 1.8, floor: 0.22, ref: 210 },
      hat: { type: "frac", lo: 8500, hi: 16000, jump: 5, gate: 12, k: 1.5, floor: 0.045, ref: 70 },
    };
    for (const n in DET) Object.assign(DET[n], { h: new Float32Array(40), i: 0, prev: 0, last: -1e9 });
    const FF = new Uint8Array(an.frequencyBinCount), FP = new Uint8Array(an.frequencyBinCount), bw = sampleRate / an.fftSize;
    const measure = (D) => {
      const i0 = Math.max(1, Math.round(D.lo / bw)), i1 = Math.min(FF.length - 1, Math.round(D.hi / bw));
      let f = 0, lvl = 0;
      for (let i = i0; i <= i1; i++) { const d = FF[i] - FP[i]; lvl += FF[i]; if (D.type === "flux") { if (d > 0) f += d; } else if (d > D.jump) f++; }
      return { m: f / (i1 - i0 + 1), lvl: lvl / (i1 - i0 + 1) };
    };
    return {
      DET,
      detect(now) {
        an.getByteFrequencyData(FF);
        const M = {}; for (const n in DET) M[n] = measure(DET[n]);
        const cMid = measure({ type: "flux", lo: 1400, hi: 6000 }).m, cHigh = measure({ type: "flux", lo: 8500, hi: 16000 }).m;
        for (const name in DET) {
          const D = DET[name], { m: fl, lvl } = M[name];
          let mu = 0; for (let i = 0; i < D.h.length; i++) mu += D.h[i]; mu /= D.h.length;
          let v = 0; for (let i = 0; i < D.h.length; i++) v += (D.h[i] - mu) * (D.h[i] - mu);
          const sd = Math.sqrt(v / D.h.length), thr = Math.max(D.floor, mu + D.k * sd);
          const shape = name === "snare" ? cMid > cHigh : name === "hat" ? cHigh > cMid * 1.3 : true;
          const masked = name === "hat" && now - DET.snare.last < 45; // a snare's noise spills into the hat band
          if (fl > thr && fl > D.prev && lvl > D.gate && now - D.last > D.ref && !masked && shape) { D.last = now; emit(name, clamp((fl - mu) / (sd * 3 + D.floor), 0.35, 1.4), now); }
          D.prev = fl; D.h[D.i] = fl; D.i = (D.i + 1) % D.h.length;
        }
        FP.set(FF);
      },
    };
  }

  // ---------- which notes are sounding ----------
  // Spectral peaks, then harmonic summation picks up to three fundamentals. A peak far louder than an
  // overtone of an already-found voice would be is another note sitting on that harmonic (chord tones do
  // this all the time), so it stays available. A note must sound in two consecutive frames to count.
  // Returns [{f, midi, s}] strongest first. Feed it an analyser of about 4096 bins with light smoothing.
  // Low candidates within 60 ms of a detected kick are ignored, so a kick's falling pitch never reads as bass.
  function noteTracker(R, anName) {
    let TD = null; const hist = new Map();
    return function detect(now) {
      const an = R.an[anName]; if (!TD || TD.length !== an.frequencyBinCount) TD = new Float32Array(an.frequencyBinCount);
      an.getFloatFrequencyData(TD);
      const bh = R.sampleRate / an.fftSize, k0 = Math.max(3, Math.ceil(38 / bh)), k1 = Math.min(TD.length - 3, Math.floor(4400 / bh));
      let gmax = -200; for (let k = k0; k <= k1; k++) if (TD[k] > gmax) gmax = TD[k];
      if (gmax < -74) { hist.clear(); return []; }
      const thr = Math.max(-84, gmax - 36), peaks = [];
      for (let k = k0 + 2; k <= k1 - 2; k++) {
        const v = TD[k];
        if (v > thr && v >= TD[k - 1] && v > TD[k + 1] && v >= TD[k - 2] && v > TD[k + 2]) {
          const a = TD[k - 1], c = TD[k + 1], den = a - 2 * v + c, d = den !== 0 ? clamp((0.5 * (a - c)) / den, -0.5, 0.5) : 0;
          peaks.push({ f: (k + d) * bh, a: Math.pow(10, (v - gmax) / 20) });
        }
      }
      peaks.sort((p, q) => q.a - p.a); if (peaks.length > 32) peaks.length = 32;
      const used = new Uint8Array(peaks.length), out = [];
      const score = (f0) => {
        let s = 0, fw = 0, ww = 0, a1 = 0;
        for (let h = 1; h <= 10; h++) {
          const t = f0 * h; let best = 0, bf = 0;
          for (let i = 0; i < peaks.length; i++) if (!used[i] && Math.abs(peaks[i].f - t) < t * 0.025 && peaks[i].a > best) { best = peaks[i].a; bf = peaks[i].f; }
          if (best > 0) { if (h === 1) a1 = best; const w = Math.min(best, ((a1 || best) * 1.3) / h) / Math.sqrt(h); s += w; fw += (bf / h) * w * h; ww += w * h; }
        }
        return [s, ww > 0 ? fw / ww : f0, a1];
      };
      let first = 0;
      for (let v = 0; v < 3; v++) {
        let bi = -1, bs = 0, bf = 0, ba = 0;
        for (let i = 0; i < peaks.length; i++) { if (used[i] || peaks[i].f > 2200) continue; const [sc, f, a] = score(peaks[i].f); if (sc > bs) { bs = sc; bi = i; bf = f; ba = a; } }
        if (bi < 0 || bs < 0.1 || (v > 0 && bs < first * 0.14)) break;
        if (v === 0) first = bs;
        const f0 = bf;
        if (!(f0 < 130 && now - R.detectedAt.kick < 60)) out.push({ f: f0, s: bs, midi: 69 + 12 * Math.log2(f0 / 440) });
        used[bi] = 1;
        for (let i = 0; i < peaks.length; i++) {
          if (used[i]) continue; const r = peaks[i].f / f0, h = Math.round(r);
          if (h >= 2 && h <= 10 && Math.abs(r - h) < 0.025 * h && peaks[i].a <= (Math.max(ba, peaks[bi].a) * 1.3) / h) used[i] = 1;
        }
      }
      const seen = new Map(), keep = [];
      for (const v of out) { const m = Math.round(v.midi); seen.set(m, (hist.get(m) || 0) + 1); if ((hist.get(m) || 0) >= 1) keep.push(v); }
      hist.clear(); for (const [m, c] of seen) hist.set(m, c);
      return keep.sort((a, b) => b.s - a.s);
    };
  }

  // ---------- how hard the music is pushing ----------
  // RMS of an analyser's waveform, smoothed (fast up, slow down), and its ratio to the long-run level, so a
  // piece can react to "louder than this track usually is" rather than to absolute volume.
  function levelMeter(R, anName) {
    let T = null, loud = 0, avg = 0.08;
    return function update(dt) {
      const an = R.an[anName]; if (!T || T.length !== an.fftSize) T = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(T);
      let s = 0; for (let i = 0; i < T.length; i++) s += T[i] * T[i];
      const rms = Math.sqrt(s / T.length);
      loud = lerp(loud, rms, rms > loud ? 0.5 : 0.12); avg = lerp(avg, loud, Math.min(1, dt * 0.25));
      return { rms: loud, rel: loud / (avg + 0.01) };
    };
  }

  // ---------- offline stand-in for an AnalyserNode ----------
  // render/ sends the smoothed dB spectrum and the time-domain samples for each frame; the byte views are
  // derived here exactly as the Web Audio spec derives them.
  class OfflineAnalyser {
    constructor(spec) {
      this.fftSize = spec.fftSize; this.frequencyBinCount = spec.fftSize / 2;
      this.smoothingTimeConstant = spec.smoothing; this.minDecibels = -100; this.maxDecibels = -30;
      this.db = new Float32Array(this.frequencyBinCount).fill(-Infinity); this.time = new Float32Array(this.fftSize);
    }
    getFloatFrequencyData(a) { a.set(this.db.length > a.length ? this.db.subarray(0, a.length) : this.db); }
    getByteFrequencyData(a) {
      const sc = 255 / (this.maxDecibels - this.minDecibels), n = Math.min(a.length, this.db.length);
      for (let i = 0; i < n; i++) { const b = Math.floor(sc * (this.db[i] - this.minDecibels)); a[i] = b < 0 ? 0 : b > 255 ? 255 : b; }
    }
    getFloatTimeDomainData(a) { a.set(this.time.length > a.length ? this.time.subarray(0, a.length) : this.time); }
    getByteTimeDomainData(a) { const n = Math.min(a.length, this.time.length); for (let i = 0; i < n; i++) { const b = Math.floor(128 * (1 + this.time[i])); a[i] = b < 0 ? 0 : b > 255 ? 255 : b; } }
  }

  //    tone  (4096 bins, light smoothing)  -> which notes are sounding
  //    level (2048)                        -> how hard the plate is driven
  // ======================================================================
  // pitch: spectral peaks, then harmonic summation picks up to three fundamentals
  // notes come from the shared note tracker, loudness from the shared level meter (wired in section 7)
  let detectVoices=null, level=null;

  let FLASH=0, SNAP=0;
  function onHit(name,str,now){
    const rm=reduce?0.35:1;
    if(name==="kick"){ IMP.kick+=1.25*str*rm; FLASH=Math.max(FLASH,str); }
    else if(name==="snare"){ IMP.snare+=1.1*str*rm; SNAP=Math.max(SNAP,str); }
    else IMP.hat+=0.45*str*rm;
  }

  // what the plate is ringing at, for the readout and the colour
  let VOICES=[], lastToneAt=-1e9;
  function setTargets(voices){
    const T=new Map(); let tot=0;
    // the lowest voice is the plate's structure; higher voices embroider on top of it
    const lowest=voices.reduce((a,v)=>v.midi<a.midi?v:a,voices[0]);
    voices.forEach(v=>{ const w=v.s*(v===lowest?1.7:0.65); tot+=w; const k=modeOf(v.midi); T.set(k,(T.get(k)||0)+w); });
    for(const [k,w] of T) T.set(k,w/tot);
    TGT=T;
  }
  function analyse(dt,now){
    if(R.mode==="idle"){ idleScript(now); return; }
    DRIVE=0.18+0.55*clamp(level(dt).rel-0.5,0,1.6);
    const v=detectVoices(now);
    if(v.length){ VOICES=v; lastToneAt=now; setTargets(VOICES); }
  }

  // idle: a quiet example so the plate is alive before any music
  const IDLE=[[45,69],[45,76],[41,72],[41,69],[48,76],[48,79],[43,74],[43,71]];
  let idleStep=-1;
  function idleScript(now){
    DRIVE=0.22;
    const st=Math.floor(now/1300);
    if(st!==idleStep){
      idleStep=st; const pr=IDLE[st%IDLE.length];
      VOICES=[{midi:pr[0],f:hz(pr[0]),s:1},{midi:pr[1],f:hz(pr[1]),s:0.8}];
      setTargets(VOICES);
      if(st%2===0) R.fire("kick",0.55,now); else R.fire("snare",0.5,now);
    }
    const sub=Math.floor(now/325); if(sub!==idleScript.h){ idleScript.h=sub; if(sub%4) R.fire("hat",0.4,now); }
  }

  // ======================================================================
  // 5. Demo: a 120 bpm track written so every voice is easy to read:
  //    intro (bass + slow melody), groove (+ drums), breakdown (one long note
  //    at a time, pure figures), drop (everything).
  // ======================================================================
  function makeDemo(actx,master,kit){
    const CH=[{b:45,a:[69,72,76]},{b:41,a:[65,69,72]},{b:48,a:[67,72,76]},{b:43,a:[67,71,74]}];
    const SEC=[["intro",8],["groove",8],["break",4],["drop",8]], LOOP=28;
    const section=bar=>{ let b=bar%LOOP; for(const [nm,len] of SEC){ if(b<len) return nm; b-=len; } return "intro"; };
    const step=0.25;
    function bass(m,t,dur){
      const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.Q.value=0.8;
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.012); g.gain.setTargetAtTime(0.2,t+0.05,0.3); g.gain.setTargetAtTime(0.0001,t+dur,0.06);
      lp.connect(g); g.connect(master);
      const o=actx.createOscillator(); o.type="sawtooth"; o.frequency.value=hz(m); o.connect(lp); o.start(t); o.stop(t+dur+0.4);
      const s=actx.createOscillator(); s.type="sine"; s.frequency.value=hz(m); const sg=actx.createGain(); sg.gain.value=0.6; s.connect(sg); sg.connect(g); s.start(t); s.stop(t+dur+0.4);
    }
    function lead(m,t,dur,v){
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.006); g.gain.setTargetAtTime(v*0.55,t+0.03,0.2); g.gain.setTargetAtTime(0.0001,t+dur,0.05);
      g.connect(master);
      const o=actx.createOscillator(); o.type="triangle"; o.frequency.value=hz(m); o.connect(g); o.start(t); o.stop(t+dur+0.3);
      const o2=actx.createOscillator(); o2.type="sine"; o2.frequency.value=hz(m+12); const g2=actx.createGain(); g2.gain.value=0.25; o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t+dur+0.3);
    }
    const ARP=[0,1,2,1,2,0,1,2];
    function schedule(n,t){
      const bar=Math.floor(n/8), st=n%8, sec=section(bar), ch=CH[bar%4];
      if(st===0 && sec!=="break") bass(ch.b,t,8*step*0.96);
      if(sec==="intro" && st%2===0) lead(ch.a[(st/2)%3],t,2*step*0.92,0.12);
      if(sec==="groove") lead(ch.a[ARP[st]],t,step*0.88,0.1);
      if(sec==="drop") lead(ch.a[ARP[st]]+(st>=4?12:0),t,step*0.88,0.1);
      if(sec==="break" && st===0) lead(ch.a[bar%3]+12,t,8*step*0.96,0.14);
      if(sec==="groove"||sec==="drop"){
        if(st%2===0) kit.kick(t,1);
        if(st===2||st===6) kit.snare(t,sec==="drop"?0.5:0.38);
        if(sec==="groove" && st%2===1) kit.hat(t,0.1);
        if(sec==="drop") kit.hat(t,st%2?0.12:0.07);
      }
    }
    const stop=AR.sequencer(actx,step,schedule);
    return {stop};
  }

  // ======================================================================
  // 6. Frame
  // ======================================================================
  let W=0,H=0,dpr=1;
  // the plate fits between the readout at the top and the controls at the bottom
  const plateSize=()=>Math.min(W*0.86,H*(innerWidth<560?0.6:0.7));
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=Math.round(innerWidth*dpr); H=cv.height=Math.round(innerHeight*dpr);
    const want=clamp(Math.round(plateSize()),360,minSide<700?620:900);
    if(want!==P) allocPlate(want);
  }
  window.addEventListener("resize",resize); resize();

  function colours(dt){
    const lead=VOICES[0];
    if(lead){ const pc=((Math.round(lead.midi)%12)+12)%12, target=((pc*7)%12)/12;
      let d=target-HUE; d-=Math.round(d); HUE=((HUE+d*Math.min(1,dt*5))%1+1)%1; }
    COL.c=hsl(HUE,0.62,0.74); COL.h=hsl(HUE+0.47,0.95,0.6);
  }

  function draw(dt){
    const S=plateSize(), x0=(W-S)/2, y0=(H-S)/2+(innerWidth<560?H*0.04:0), u=S/1000;
    ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
    let g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.hypot(W,H)*0.6);
    g.addColorStop(0,"#0a0c13"); g.addColorStop(1,"#030407"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // plate
    g=ctx.createLinearGradient(x0,y0,x0+S,y0+S); g.addColorStop(0,"#0b0e15"); g.addColorStop(1,"#06070c");
    ctx.fillStyle=g; ctx.fillRect(x0,y0,S,S);
    // sand
    ctx.globalCompositeOperation="lighter"; ctx.imageSmoothingEnabled=true;
    ctx.drawImage(pcan,x0,y0,S,S);
    ctx.globalAlpha=soft(0.18+0.5*DRIVE+0.4*FLASH,0.55*glow); ctx.drawImage(b1,x0,y0,S,S);
    ctx.globalAlpha=soft(0.12+0.35*DRIVE+0.5*FLASH,0.42*glow); ctx.drawImage(b2,x0-S*0.08,y0-S*0.08,S*1.16,S*1.16);
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
    // frame: hairline edge that flashes on a strike, corner ticks, centre bolt
    const c=COL.c.map(v=>Math.round(v*255)).join(",");
    ctx.strokeStyle="rgba("+c+","+(0.22+0.6*FLASH).toFixed(3)+")"; ctx.lineWidth=Math.max(1,u*(1.2+3*FLASH)); ctx.strokeRect(x0,y0,S,S);
    ctx.strokeStyle="rgba("+c+",0.55)"; ctx.lineWidth=Math.max(1,u*1.4); const t=u*22, o=u*10;
    ctx.beginPath();
    for(const [cx,cy,sx,sy] of [[x0,y0,-1,-1],[x0+S,y0,1,-1],[x0,y0+S,-1,1],[x0+S,y0+S,1,1]]){
      ctx.moveTo(cx+sx*o,cy+sy*(o+t)); ctx.lineTo(cx+sx*o,cy+sy*o); ctx.lineTo(cx+sx*(o+t),cy+sy*o);
    }
    ctx.stroke();
    const bx=x0+S/2, by=y0+S/2, br=u*9;
    ctx.fillStyle="#141822"; ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="rgba("+c+",0.6)"; ctx.lineWidth=Math.max(1,u*1.3); ctx.stroke();
    ctx.fillStyle="rgba("+c+",0.8)"; ctx.beginPath(); ctx.arc(bx,by,br*0.3,0,Math.PI*2); ctx.fill();
    // engraved mode under the plate
    const lead=VOICES[0];
    if(lead){
      const [n,m]=MODES[modeOf(lead.midi)];
      ctx.font=Math.round(u*15)+"px "+getComputedStyle(document.body).fontFamily;
      ctx.fillStyle="rgba("+c+",0.45)"; ctx.textAlign="left"; ctx.textBaseline="bottom";
      ctx.fillText("n "+n+"  m "+m+"  λ "+(n*n+m*m),x0,y0-u*12);
      ctx.textAlign="right"; ctx.fillText(lead.f.toFixed(1)+" Hz",x0+S,y0-u*12);
    }
  }

  let lastReadout="";
  function readout(){
    const lead=VOICES[0];
    let s="";
    if(lead){
      const m=Math.round(lead.midi), [n,mm]=MODES[modeOf(lead.midi)];
      const others=VOICES.slice(1).map(v=>noteName(Math.round(v.midi))).join("  ");
      const src=R.sourceLabel();
      s=noteName(m)+"|"+lead.f.toFixed(1)+"|"+n+","+mm+"|"+others+"|"+src;
      if(s!==lastReadout){
        lastReadout=s;
        $("note").innerHTML=noteName(m)+"<small>"+lead.f.toFixed(1)+" Hz</small>";
        $("read").innerHTML="MODE <b>("+n+","+mm+")</b>";
        $("voices").innerHTML=others?"WITH <b>"+others+"</b>":"&nbsp;";
        $("src").innerHTML="SOURCE <b>"+src.replace(/[<>&]/g,"")+"</b>";
      }
    }
  }

  function step(now,dt){
    analyse(dt,now);
    stepWeights(dt); buildField();
    const w0=performance.now();
    updateSand(dt,true);
    const work=performance.now()-w0;
    if(!R.offline) nAct=clamp(nAct*(work>11?0.93:work<6?1.03:1),15000,NMAX);
    colours(dt); develop(dt); draw(dt); readout();
    FLASH*=Math.exp(-dt*9); SNAP*=Math.exp(-dt*9);
  }

  // ======================================================================
  // 7. Wiring into the shared base
  // ======================================================================
  const R=AR.create({
    name:"cymatica", canvas:cv, lookahead:0.1,
    analysers:{
      tone:{fftSize:4096,smoothing:0.25,needs:["freq"],lead:0.07},
      level:{fftSize:2048,smoothing:0.6,needs:["time"]}
    },
    onsets:true, demo:makeDemo, demoName:"Demo track",
    glow:{min:0.2,max:1.2,value:0.65,onChange:v=>{ glow=v; }},
    onHit, step,
    onSource:()=>{ lastReadout=""; idleStep=-1; },
    // offline renders use a fixed grain count, so the same seed always gives the same video
    offlineSetup:(cfg)=>{ nAct=clamp(cfg.particles||NMAX,15000,NMAX); return {particles:nAct|0}; }
  });

  // boot: let the sand settle into the first figure before the first frame, so the page opens complete
  detectVoices=AR.noteTracker(R,"tone"); level=AR.levelMeter(R,"level");
  idleScript(R.offline?0:performance.now()); IMP.kick=IMP.snare=IMP.hat=0;
  for(const [k,w] of TGT) WM.set(k,w);
  buildField();
  for(let i=0;i<70;i++) updateSand(1/60,false);
  R.start();
})();
</script>

<script>/* Homepage embed: the piece's own controls are hidden; one button starts or stops its built-in track. */
(function(){var b=document.createElement('button');b.id='syb-sound';b.type='button';b.setAttribute('aria-pressed','false');b.textContent='Sound';
b.addEventListener('click',function(){var d=document.getElementById('btnDemo');if(!d)return;d.click();var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.textContent=on?'Sound on':'Sound';try{parent.postMessage({syb:'sound',on:on},location.origin)}catch(e){}});
document.body.appendChild(b);
function ready(){try{parent.postMessage({syb:'ready'},location.origin)}catch(e){}}
if(document.readyState==='complete')setTimeout(ready,300);else addEventListener('load',function(){setTimeout(ready,300)});})();</script>
