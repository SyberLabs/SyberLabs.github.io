<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Plutonian Core</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plutonian Core: a music-reactive monstrance that throws lightning. A strange-attractor core inside a sunburst crown of rays, driven live by the music.">
<style>
  /* Layout: full-bleed altar. The monstrance owns the center; chrome sits at the corners like plate labels. */
  :root{
    --ground:#050507;
    --ink:#ebe5d4;
    --ink-dim:#8f8977;
    --gold:#d3ad55;
    --gold-deep:#7d6631;
    --line:rgba(211,173,85,.26);
    --panel:rgba(9,9,12,.66);
    --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  html,body{height:100%;background:var(--ground);color:var(--ink);overflow:hidden;}
  body{font-family:var(--display);-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;}

  .chrome{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
    transition:opacity .45s ease;}
  .chrome.off{opacity:0;}
  .chrome.off *{pointer-events:none!important;}

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .brand{font-family:var(--mono);font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,5vw,46px);letter-spacing:.03em;line-height:1;margin:.14em 0 0;text-wrap:balance;}
  h1 i{font-weight:400;color:var(--ink-dim);font-size:.62em;letter-spacing:.06em;}
  .back{pointer-events:auto;display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);text-decoration:none;padding:4px 0;margin-bottom:6px;}
  .back:hover,.back:focus-visible{color:var(--ink);}
  .back:focus-visible{outline:1px solid var(--gold);outline-offset:4px;}
  .plate{font-family:var(--mono);font-size:10px;letter-spacing:.1em;line-height:1.7;color:var(--ink-dim);text-align:right;font-variant-numeric:tabular-nums;}
  .plate b{color:var(--ink);font-weight:400;}
  .plate-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .hits{display:flex;gap:6px;}
  .hits span{--on:0;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:3px 6px;
    border:1px solid var(--line);color:var(--ink-dim);
    background:color-mix(in srgb,var(--gold) calc(var(--on)*85%),transparent);
    color:color-mix(in srgb,#17110a calc(var(--on)*100%),var(--ink-dim));}
  @media (max-width:560px){ .plate-col{align-items:flex-start;} }

  .bottom{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .bar{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:100%;
    background:var(--panel);border:1px solid var(--line);padding:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  button,select{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 12px;cursor:pointer;min-height:38px;
    transition:border-color .15s,color .15s,background .15s;}
  button:hover,select:hover{border-color:var(--gold);}
  button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  button.primary{background:var(--gold);border-color:var(--gold);color:#17110a;font-weight:700;}
  button.primary:hover{background:#e0bd68;}
  button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);}
  select{background:var(--ground);padding-right:8px;}
  .glow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-dim);border:1px solid var(--line);padding:0 10px;min-height:38px;}
  .glow input{-webkit-appearance:none;appearance:none;width:84px;height:2px;background:var(--line);outline:none;margin:0;}
  .glow input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid var(--ground);}
  .glow input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid var(--ground);}
  .glow input:focus-visible{outline:2px solid var(--gold);outline-offset:6px;}
  .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-dim);text-align:center;}
  .hint kbd{font-family:var(--mono);color:var(--ink);border:1px solid var(--line);padding:0 4px;}

  .toast{position:fixed;left:50%;top:calc(50% + min(34vw,34vh));transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;line-height:1.6;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);padding:10px 14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;}
  .toast.on{opacity:1;}

  .drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;
    font-family:var(--display);font-style:italic;font-size:clamp(24px,4vw,40px);color:var(--gold);background:rgba(5,5,7,.55);}
  .drop.on{opacity:1;}

  @media (max-width:560px){
    .plate{text-align:left;}
    .hint{display:none;}
    button,select{padding:9px 9px;font-size:10px;letter-spacing:.08em;}
  }
</style>

<meta name="robots" content="noindex">
<style id="syb-embed">#chrome,#toast,#drop{display:none!important}html,body{overflow:hidden}
#syb-sound{position:fixed;right:10px;bottom:10px;z-index:99;min-height:44px;padding:0 13px;border:1px solid rgba(140,200,235,.3);border-radius:2px;background:rgba(2,7,10,.6);color:#c3cfd6;font:500 10px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#syb-sound[aria-pressed=true]{color:#fd9273;border-color:#fc734d}</style></head>
<body>
<canvas id="stage" aria-label="Plutonian Core: a music-reactive monstrance throwing lightning"></canvas>

<div class="chrome" id="chrome">
  <div class="top">
    <div>
      <div class="brand">SyberLabs · Engines</div>
      <h1>Plutonian <i>Core</i></h1>
    </div>
    <div class="plate-col">
      <div class="plate" id="plate"></div>
      <div class="hits" aria-hidden="true"><span id="ind-kick">Kick</span><span id="ind-snare">Snare</span><span id="ind-hat">Hats</span></div>
    </div>
  </div>

  <div class="bottom">
    <div class="bar" role="toolbar" aria-label="Sound and form">
      <button class="primary" id="btnDemo" type="button">Play demo</button>
      <button id="btnFile" type="button">Load track</button>
      <button id="btnMic" type="button">Mic</button>
      <button id="btnForm" type="button">New form</button>
      <select id="palette" aria-label="Palette">
        <option value="auto" selected>Auto (music)</option>
        <option value="reliquary">Reliquary</option>
        <option value="iris">Iris</option>
        <option value="gold">Gold</option>
        <option value="ember">Ember</option>
        <option value="ice">Ice</option>
        <option value="lilac">Lilac</option>
        <option value="rose">Rose</option>
        <option value="teal">Teal</option>
        <option value="verdant">Verdant</option>
        <option value="peacock">Peacock</option>
        <option value="sepia">Sepia</option>
      </select>
      <label class="glow" for="glow">Glow <input type="range" id="glow" min="0.25" max="1.2" step="0.05" value="0.7"></label>
      <button id="btnFull" type="button">Full</button>
      <button id="btnHide" type="button">Hide</button>
    </div>
    <div class="hint">Drop an audio file anywhere · <kbd>Space</kbd> play or stop · <kbd>N</kbd> new form · <kbd>[</kbd> <kbd>]</kbd> glow · <kbd>H</kbd> hide · <kbd>F</kbd> fullscreen</div>
  </div>
</div>
<input type="file" id="file" accept="audio/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop" id="drop">Release to play</div>

<script>/* shared/audio-reactive.js, inlined by tools/bundle.mjs */
/*
 * SyberLabs audio-reactive base, shared by every piece in this repo.
 *
 * A piece supplies its visuals, its own analysis and its demo track. This base supplies the rest:
 *   - the audio graph: demo, file and mic sources, named analysers, and a look-ahead delay so
 *     visuals land on the sound (the speakers hear everything `lookahead` seconds after the analysers)
 *   - kick, snare and hat detection, with hits queued to fire on the sound
 *   - drum synths for demo tracks
 *   - noteTracker (which notes are sounding) and levelMeter (how hard the music is pushing)
 *   - the standard controls, by element id: btnDemo, btnFile, file, btnMic, btnFull, btnHide,
 *     glow, chrome, toast, drop, ind-kick, ind-snare, ind-hat (any can be left out)
 *   - a frame loop that survives a bad frame
 *   - offline rendering: with ?offline=1 the page is driven frame by frame by render/ (see
 *     window.AudioReactivePage below), randomness is seeded from ?seed=, and analysers are fed
 *     data computed in Node exactly as an AnalyserNode would compute it
 *
 * Usage, in a piece:
 *   const R = AudioReactive.create({
 *     name: "cymatica",                          // storage key prefix
 *     canvas,                                     // what offline capture records
 *     analysers: { tone: {fftSize:4096, smoothing:0.25, needs:["freq"], lead:0.07} },
 *     onsets: true,                               // built-in kick/snare/hat detection
 *     lookahead: 0.1,
 *     demo: (actx, dest, kit, R) => ({ stop(){} }),
 *     onHit: (name, strength, now) => {},         // fired on the sound
 *     step: (now, dt) => {},                      // every frame
 *   });
 *   R.mode is "idle" | "demo" | "file" | "mic"; R.an.tone is an AnalyserNode (or its offline stand-in).
 */
(function () {
  "use strict";
  const QS = new URLSearchParams(location.search);
  const OFFLINE = QS.get("offline") === "1";

  // ---------- seeded randomness ----------
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return h >>> 0; };
  }
  function mulberry32(a) {
    return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  // offline renders must be repeatable, so every Math.random in the page is seeded before any piece code runs
  if (OFFLINE) Math.random = mulberry32(xmur3("ar|" + (QS.get("seed") || "SYBER"))());

  // ---------- small helpers every piece uses ----------
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const fract = (x) => x - Math.floor(x);
  // soft ceiling: linear near zero, never exceeds max
  const soft = (x, max) => (max <= 0 ? 0 : max * (1 - Math.exp(-Math.max(0, x) / max)));
  const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const noteName = (m) => NOTE[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const esc = (s) => String(s).replace(/[<>&"]/g, (m) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[m]));

  // ---------- drum synths for demo tracks ----------
  function drumKit(actx, dest) {
    const noise = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const env = (g, t, a, peak, rel) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + rel); };
    return {
      noise, env,
      kick(t, v = 1) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); env(g, t, 0.004, v, 0.4); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.5); },
      snare(t, v = 0.4) {
        const s = actx.createBufferSource(); s.buffer = noise; const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 0.7;
        const g = actx.createGain(); env(g, t, 0.002, v, 0.17); s.connect(bp); bp.connect(g); g.connect(dest); s.start(t); s.stop(t + 0.25);
        const o = actx.createOscillator(), og = actx.createGain(); o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.08);
        env(og, t, 0.002, v * 0.6, 0.1); o.connect(og); og.connect(dest); o.start(t); o.stop(t + 0.15);
      },
      hat(t, v = 0.1) { const s = actx.createBufferSource(); s.buffer = noise; const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7500; const g = actx.createGain(); env(g, t, 0.002, v, 0.06); s.connect(hp); hp.connect(g); g.connect(dest); s.start(t); s.stop(t + 0.1); },
    };
  }
  // a step sequencer clock: calls schedule(n, t) for every step, slightly ahead of time
  function sequencer(actx, stepSeconds, schedule) {
    let n = 0, next = actx.currentTime + 0.12;
    const timer = setInterval(() => { while (next < actx.currentTime + 0.15) { schedule(n, next); next += stepSeconds; n++; } }, 25);
    return () => clearInterval(timer);
  }

  // ---------- kick / snare / hat detection ----------
  // One detector per instrument class, each against its own rolling mean + k*sd, fired on the rising edge.
  // Kick: loudness jump in the sub band, gated by real low-end level.
  // Snare and hats: broadband noise, measured as the share of bins in the band that jump at once, so tonal
  // notes (which light only a few bins) do not count; mid-heavy bursts are snares, top-heavy are hats.
  function onsetDetector(an, sampleRate, emit) {
    const DET = {
      kick: { type: "flux", lo: 40, hi: 130, gate: 150, k: 1.4, floor: 8, ref: 150 },
      snare: { type: "frac", lo: 1400, hi: 6000, jump: 15, gate: 55, k: 1.8, floor: 0.22, ref: 210 },
      hat: { type: "frac", lo: 8500, hi: 16000, jump: 5, gate: 12, k: 1.5, floor: 0.045, ref: 70 },
    };
    for (const n in DET) Object.assign(DET[n], { h: new Float32Array(40), i: 0, prev: 0, last: -1e9 });
    const FF = new Uint8Array(an.frequencyBinCount), FP = new Uint8Array(an.frequencyBinCount), bw = sampleRate / an.fftSize;
    const measure = (D) => {
      const i0 = Math.max(1, Math.round(D.lo / bw)), i1 = Math.min(FF.length - 1, Math.round(D.hi / bw));
      let f = 0, lvl = 0;
      for (let i = i0; i <= i1; i++) { const d = FF[i] - FP[i]; lvl += FF[i]; if (D.type === "flux") { if (d > 0) f += d; } else if (d > D.jump) f++; }
      return { m: f / (i1 - i0 + 1), lvl: lvl / (i1 - i0 + 1) };
    };
    return {
      DET,
      detect(now) {
        an.getByteFrequencyData(FF);
        const M = {}; for (const n in DET) M[n] = measure(DET[n]);
        const cMid = measure({ type: "flux", lo: 1400, hi: 6000 }).m, cHigh = measure({ type: "flux", lo: 8500, hi: 16000 }).m;
        for (const name in DET) {
          const D = DET[name], { m: fl, lvl } = M[name];
          let mu = 0; for (let i = 0; i < D.h.length; i++) mu += D.h[i]; mu /= D.h.length;
          let v = 0; for (let i = 0; i < D.h.length; i++) v += (D.h[i] - mu) * (D.h[i] - mu);
          const sd = Math.sqrt(v / D.h.length), thr = Math.max(D.floor, mu + D.k * sd);
          const shape = name === "snare" ? cMid > cHigh : name === "hat" ? cHigh > cMid * 1.3 : true;
          const masked = name === "hat" && now - DET.snare.last < 45; // a snare's noise spills into the hat band
          if (fl > thr && fl > D.prev && lvl > D.gate && now - D.last > D.ref && !masked && shape) { D.last = now; emit(name, clamp((fl - mu) / (sd * 3 + D.floor), 0.35, 1.4), now); }
          D.prev = fl; D.h[D.i] = fl; D.i = (D.i + 1) % D.h.length;
        }
        FP.set(FF);
      },
    };
  }

  // ---------- which notes are sounding ----------
  // Spectral peaks, then harmonic summation picks up to three fundamentals. A peak far louder than an
  // overtone of an already-found voice would be is another note sitting on that harmonic (chord tones do
  // this all the time), so it stays available. A note must sound in two consecutive frames to count.
  // Returns [{f, midi, s}] strongest first. Feed it an analyser of about 4096 bins with light smoothing.
  // Low candidates within 60 ms of a detected kick are ignored, so a kick's falling pitch never reads as bass.
  function noteTracker(R, anName) {
    let TD = null; const hist = new Map();
    return function detect(now) {
      const an = R.an[anName]; if (!TD || TD.length !== an.frequencyBinCount) TD = new Float32Array(an.frequencyBinCount);
      an.getFloatFrequencyData(TD);
      const bh = R.sampleRate / an.fftSize, k0 = Math.max(3, Math.ceil(38 / bh)), k1 = Math.min(TD.length - 3, Math.floor(4400 / bh));
      let gmax = -200; for (let k = k0; k <= k1; k++) if (TD[k] > gmax) gmax = TD[k];
      if (gmax < -74) { hist.clear(); return []; }
      const thr = Math.max(-84, gmax - 36), peaks = [];
      for (let k = k0 + 2; k <= k1 - 2; k++) {
        const v = TD[k];
        if (v > thr && v >= TD[k - 1] && v > TD[k + 1] && v >= TD[k - 2] && v > TD[k + 2]) {
          const a = TD[k - 1], c = TD[k + 1], den = a - 2 * v + c, d = den !== 0 ? clamp((0.5 * (a - c)) / den, -0.5, 0.5) : 0;
          peaks.push({ f: (k + d) * bh, a: Math.pow(10, (v - gmax) / 20) });
        }
      }
      peaks.sort((p, q) => q.a - p.a); if (peaks.length > 32) peaks.length = 32;
      const used = new Uint8Array(peaks.length), out = [];
      const score = (f0) => {
        let s = 0, fw = 0, ww = 0, a1 = 0;
        for (let h = 1; h <= 10; h++) {
          const t = f0 * h; let best = 0, bf = 0;
          for (let i = 0; i < peaks.length; i++) if (!used[i] && Math.abs(peaks[i].f - t) < t * 0.025 && peaks[i].a > best) { best = peaks[i].a; bf = peaks[i].f; }
          if (best > 0) { if (h === 1) a1 = best; const w = Math.min(best, ((a1 || best) * 1.3) / h) / Math.sqrt(h); s += w; fw += (bf / h) * w * h; ww += w * h; }
        }
        return [s, ww > 0 ? fw / ww : f0, a1];
      };
      let first = 0;
      for (let v = 0; v < 3; v++) {
        let bi = -1, bs = 0, bf = 0, ba = 0;
        for (let i = 0; i < peaks.length; i++) { if (used[i] || peaks[i].f > 2200) continue; const [sc, f, a] = score(peaks[i].f); if (sc > bs) { bs = sc; bi = i; bf = f; ba = a; } }
        if (bi < 0 || bs < 0.1 || (v > 0 && bs < first * 0.14)) break;
        if (v === 0) first = bs;
        const f0 = bf;
        if (!(f0 < 130 && now - R.detectedAt.kick < 60)) out.push({ f: f0, s: bs, midi: 69 + 12 * Math.log2(f0 / 440) });
        used[bi] = 1;
        for (let i = 0; i < peaks.length; i++) {
          if (used[i]) continue; const r = peaks[i].f / f0, h = Math.round(r);
          if (h >= 2 && h <= 10 && Math.abs(r - h) < 0.025 * h && peaks[i].a <= (Math.max(ba, peaks[bi].a) * 1.3) / h) used[i] = 1;
        }
      }
      const seen = new Map(), keep = [];
      for (const v of out) { const m = Math.round(v.midi); seen.set(m, (hist.get(m) || 0) + 1); if ((hist.get(m) || 0) >= 1) keep.push(v); }
      hist.clear(); for (const [m, c] of seen) hist.set(m, c);
      return keep.sort((a, b) => b.s - a.s);
    };
  }

  // ---------- how hard the music is pushing ----------
  // RMS of an analyser's waveform, smoothed (fast up, slow down), and its ratio to the long-run level, so a
  // piece can react to "louder than this track usually is" rather than to absolute volume.
  function levelMeter(R, anName) {
    let T = null, loud = 0, avg = 0.08;
    return function update(dt) {
      const an = R.an[anName]; if (!T || T.length !== an.fftSize) T = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(T);
      let s = 0; for (let i = 0; i < T.length; i++) s += T[i] * T[i];
      const rms = Math.sqrt(s / T.length);
      loud = lerp(loud, rms, rms > loud ? 0.5 : 0.12); avg = lerp(avg, loud, Math.min(1, dt * 0.25));
      return { rms: loud, rel: loud / (avg + 0.01) };
    };
  }

  // ---------- offline stand-in for an AnalyserNode ----------
  // render/ sends the smoothed dB spectrum and the time-domain samples for each frame; the byte views are
  // derived here exactly as the Web Audio spec derives them.
  class OfflineAnalyser {
    constructor(spec) {
      this.fftSize = spec.fftSize; this.frequencyBinCount = spec.fftSize / 2;
      this.smoothingTimeConstant = spec.smoothing; this.minDecibels = -100; this.maxDecibels = -30;

  // ---------- audio ----------
  const A={bass:0,mid:0,treble:0,energy:0,kick:0,kickEvent:0,bassAvg:0.1,lastKick:0,shortE:0,longE:0.15,lastSwitch:0};
  // the shared base runs the audio graph, the sources and kick/snare/hat detection;
  // this piece reads one smoothed analyser ("level") for its spectrum and waveform
  let wave=new Uint8Array(2048).fill(128), freq=new Uint8Array(1024), binHz=23.4;
  function bandAvg(lo,hi){
    const i0=Math.max(1,Math.round(lo/binHz)), i1=Math.min(freq.length-1,Math.max(i0,Math.round(hi/binHz)));
    let s=0; for(let i=i0;i<=i1;i++){ const x=freq[i]/255; s+=x*x; }
    return Math.sqrt(s/(i1-i0+1));
  }
  // folded spectrum: k=0 is the deep end, k=1 the bright end
  function spec(k,t){
    if(RT.mode==="idle"){

  function roughRing(cx,cy,rr,amp,ph,age,lo,hi,rough,w){

  // procedural demo: a slow modal hymn with a pulse that comes and goes

      if(sec===2 && n%2===1) kit.hat(t,0.12);
      if((sec===1||sec===2) && (n%8===2||n%8===6)) kit.snare(t,sec===2?0.5:0.35);
      if(sec===1 && n%4===3) kit.hat(t,0.06);
      const pb=sec===2?0.85:sec===0?0.45:sec===3?0.2:0.55;
      if(((n*7919)%100)/100<pb) bell(ch[ARP[n%8]]+24+(sec===2&&n%8===5?12:0),t,sec===3?0.05:0.09);
    }
    const stop=AR.sequencer(actx,step,schedule);
    return {stop};
  }

  // ---------- render ----------
  let W=0,H=0,dpr=1,NR=0;
  let rayVal,rayAvg,rayPeak,rayKick,rayLen,rayVel,tipX,tipY,tipA;
  function allocRays(){
    rayVal=new Float32Array(NR); rayAvg=new Float32Array(NR); rayPeak=new Float32Array(NR).fill(0.2);
    rayKick=new Float32Array(NR); rayLen=new Float32Array(NR).fill(0.2); rayVel=new Float32Array(NR);
    tipX=new Float32Array(NR); tipY=new Float32Array(NR); tipA=new Float32Array(NR);
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=Math.round(innerWidth*dpr); H=cv.height=Math.round(innerHeight*dpr);
    const n=Math.min(innerWidth,innerHeight)<560?96:128;
    if(n!==NR){ NR=n; allocRays(); }
  }
  window.addEventListener("resize",resize); resize();

  // halo physics: the crown swings like a censer on each beat; shockwaves climb the rays
  // depth z: + toward the viewer, - away. pitch p: + the top tips toward the viewer
  const HL={z:0,zV:0,p:0,pV:0,drift:0,phase:0,burst:0,pulses:[],flash:0,punch:0,snare:0,hat:0,hatN:0,idleStep:-1};
  const GEO={cx:0,cy:0,luna:1,r0:1,Lmax:1,unit:1,step:1};
  const PX=new Float32Array(24), PY=new Float32Array(24), LX=new Float32Array(24), LY=new Float32Array(24), RX=new Float32Array(24), RY=new Float32Array(24);

  // the waveform drawn around a circle, folded so the seam disappears
  function corona(cx,cy,r,amp,alpha,lw,shift,rot){
    if(alpha<0.004) return;
    const steps=260, n=wave.length;
    ctx.beginPath();
    for(let s=0;s<=steps;s++){
      const f=s/steps, fold=f<0.5?f*2:(1-f)*2;
      const smp=(wave[(shift+Math.floor(fold*900))%n]-128)/128;
      const a=-Math.PI/2+f*2*Math.PI+rot, rr=r+smp*amp;
      const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
      s?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle="rgba("+rayHot+","+alpha.toFixed(3)+")"; ctx.lineWidth=lw; ctx.stroke();
  }

  function render(t,dt){
    const now=t*1000;
    const Smin=Math.min(W,H), cx=W/2, cy=H/2;
    const luna=Smin*0.2*(1+0.01*A.kick), r0=luna*1.13, Lmax=Smin*0.5-r0;
    const E=A.energy, K=A.kick, G=S.glow, unit=Smin/1000;
    const half=NR/2, wob=reduce?0.25:1, step=2*Math.PI/NR;
    const cap=Math.min(1,G+0.25), rayCap=0.4+0.6*cap;
    GEO.cx=cx; GEO.cy=cy; GEO.luna=luna; GEO.r0=r0; GEO.Lmax=Lmax; GEO.unit=unit; GEO.step=step;

    // crown motion
    // underdamped springs: a beat throws the crown forward, it recoils slightly behind rest, then settles
    HL.zV+=(-HL.z*30-HL.zV*5.2)*dt; HL.z+=HL.zV*dt;
    const pRest=reduce?0:0.05*Math.sin(t*0.31)*(0.4+A.mid);
    HL.pV+=(-(HL.p-pRest)*22-HL.pV*4.2)*dt; HL.p+=HL.pV*dt;
    HL.z=clamp(HL.z,-0.6,1.2); HL.p=clamp(HL.p,-0.35,0.45);
    HL.phase+=dt*(2.2+9*E)*(reduce?0.3:1);
    HL.drift=0;
    // each layer sits at its own depth: nearer layers scale more with z and shift more with pitch (parallax);
    // pitch also foreshortens the crown vertically, so a nod reads as the top tipping toward you
    const Z=HL.z, PI2=HL.p;
    function layer(d){
      const sc=1+Z*0.075*(0.35+d), sy=sc*(1-0.16*Math.abs(Math.sin(PI2))*(0.4+d)), dy=-Math.sin(PI2)*Smin*0.045*d;
      ctx.setTransform(sc,0,0,sy,cx-sc*cx,cy-sy*cy+dy);
    }
    const near=clamp(1+0.35*Z,0.7,1.45);   // brightness with nearness

    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
    let g=radial(cx,cy,0,cx,cy,Math.hypot(W,H)*0.6);
    g.addColorStop(0,"#0d0d12"); g.addColorStop(0.55,"#07070a"); g.addColorStop(1,"#030304");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation="lighter";
    layer(0.5);
    const aur=soft(0.08+0.2*E+0.16*K,0.26*G);
    g=radial(cx,cy,luna*0.9,cx,cy,Smin*0.62);
    g.addColorStop(0,"rgba("+rayRGB+","+aur.toFixed(3)+")");
    g.addColorStop(0.45,"rgba("+rayRGB+","+(aur*0.3).toFixed(3)+")");
    g.addColorStop(1,"rgba("+rayRGB+",0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.setTransform(1,0,0,1,0,0);

    // treble filaments: hairlines that flicker in length
    layer(0.6);
    const fil=soft(0.05+0.85*HL.hat,0.6*cap), par=HL.hatN%2;
    g=radial(cx,cy,r0,cx,cy,r0+Lmax*0.9);
    g.addColorStop(0,"rgba("+rayHot+","+fil.toFixed(3)+")");
    g.addColorStop(1,"rgba("+rayRGB+",0)");
    ctx.beginPath();
    for(let i=0;i<NR;i++){
      const fl=Lmax*(0.1+0.62*HL.hat*((i+par)%2?0.45:1));
      const a=-Math.PI/2+(i+0.5)*step, ab=a;
      ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
      ctx.quadraticCurveTo(cx+Math.cos(a)*(r0+fl*0.5),cy+Math.sin(a)*(r0+fl*0.5),cx+Math.cos(ab)*(r0+fl),cy+Math.sin(ab)*(r0+fl));
    }
    ctx.strokeStyle=g; ctx.lineWidth=Math.max(0.5,0.45*dpr); ctx.stroke();

    layer(0.75);
    // rays. Each listens to its own band: level, auto-gain against its recent peak,
    // and transients (spectral flux). Length follows an underdamped spring, so hits overshoot.
    // tiers repeat every 8: major blade, flame, minor blade, flame, mid blade, flame, minor blade, flame
    const TIER=[1,0.76,0.5,0.76,0.82,0.76,0.5,0.76];
    const kS=260, cS=2*Math.sqrt(kS)*0.36;
    for(let i=0;i<NR;i++){
      const k=Math.min(i,NR-i)/half, sv=spec(k,t);
      rayAvg[i]=lerp(rayAvg[i],sv,Math.min(1,dt*3));
      rayPeak[i]=Math.max(sv,rayPeak[i]-dt*0.18);
      const flux=Math.max(0,sv-rayAvg[i]-0.015);
      rayKick[i]=Math.max(rayKick[i]*Math.exp(-dt*6),Math.min(1.4,flux*3.6));
      const lev=lerp(sv,clamp(sv/Math.max(rayPeak[i],0.18),0,1),0.55);
      rayVal[i]=lerp(rayVal[i],lev,Math.min(1,dt*(lev>rayVal[i]?22:6)));
      const v=rayVal[i], rk=rayKick[i], blade=i%2===0, tier=TIER[i%8];
      const tgt=tier*(0.14+0.5*v+0.4*rk+0.6*HL.snare+(tier===1?0.35*HL.punch:0));
      rayVel[i]+=((tgt-rayLen[i])*kS-rayVel[i]*cS)*dt; rayLen[i]+=rayVel[i]*dt;
      const len=Lmax*clamp(rayLen[i]*(1+0.16*Z+0.05*HL.zV*(blade?1:1.4)),0.04,1.18);
      const a=-Math.PI/2+i*step;
      const bend=blade?0:Math.sin(t*0.5+i*0.7)*0.025*wob;
      const segs=blade?10:18, ph=HL.phase;
      const amp=blade?0:unit*(2.5+11*(A.mid+rk))*wob;
      const w0=blade?unit*(tier===1?3.6:tier>0.8?2.7:1.9)*(0.85+0.5*v+0.6*rk):unit*(1.3+1.6*v+1.3*rk);
      for(let q=0;q<=segs;q++){
        const f=q/segs, r=r0+len*f, ang=a+bend*f*f, c=Math.cos(ang), sn=Math.sin(ang);
        const off=blade?0:Math.sin(f*Math.PI*3-ph+i*1.3)*amp*f*(1-0.35*f);
        const px=cx+c*r-sn*off, py=cy+sn*r+c*off;
        const w=blade?w0*Math.pow(1-f,1.5)+0.1*unit:w0*Math.pow(1-f,1.15)*(0.72+0.38*Math.sin(f*7-ph*1.7+i))+0.1*unit;
        PX[q]=px; PY[q]=py; LX[q]=px-sn*w; LY[q]=py+c*w; RX[q]=px+sn*w; RY[q]=py-c*w;
        if(q===segs){ tipX[i]=px; tipY[i]=py; tipA[i]=ang; }
      }
      const al=Math.min(rayCap,rayCap*(0.26+0.62*Math.min(1,v*1.2)+0.4*rk)*near);
      const lg=ctx.createLinearGradient(PX[0],PY[0],PX[segs],PY[segs]);
      lg.addColorStop(0,"rgba("+rayHot+","+al.toFixed(3)+")");
      lg.addColorStop(0.3,"rgba("+rayRGB+","+(al*0.72).toFixed(3)+")");
      lg.addColorStop(0.85,"rgba("+rayRGB+","+(al*0.14).toFixed(3)+")");
      lg.addColorStop(1,"rgba("+rayRGB+",0)");
      ctx.beginPath(); ctx.moveTo(LX[0],LY[0]);
      for(let q=1;q<=segs;q++) ctx.lineTo(LX[q],LY[q]);
      for(let q=segs;q>=0;q--) ctx.lineTo(RX[q],RY[q]);
      ctx.closePath(); ctx.fillStyle=lg; ctx.fill();
      if(HL.snare>0.04){ ctx.fillStyle="rgba(255,255,255,"+soft(HL.snare*0.45,0.5*cap).toFixed(3)+")"; ctx.fill(); }
      if(blade){
        ctx.beginPath(); ctx.moveTo(PX[0],PY[0]);
        for(let q=1;q<=segs;q++) ctx.lineTo(PX[q],PY[q]);
        ctx.strokeStyle=lg; ctx.lineWidth=Math.max(0.5,0.55*dpr); ctx.stroke();
      }
      // a small hard glint where a transient lands, set inside the visible part of the ray
      const glint=rk-0.3;
      if(glint>0){
        const q=Math.round(segs*0.72), tx=PX[q], ty=PY[q], gr=unit*(0.9+2.2*glint), tg=radial(tx,ty,0,tx,ty,gr*2.2);
        tg.addColorStop(0,"rgba("+rayHot+","+soft(al*glint*1.6,0.45*cap).toFixed(3)+")"); tg.addColorStop(1,"rgba("+rayRGB+",0)");
        ctx.fillStyle=tg; ctx.fillRect(tx-gr*2.2,ty-gr*2.2,gr*4.4,gr*4.4);
      }
    }
    HL.burst=0;

    // waveform corona at the base of the rays, and a faint outer envelope
    const crot=0;
    layer(0.45);
    corona(cx,cy,r0*1.005,unit*(5+24*A.mid+10*K)*wob,soft(0.1+0.35*A.mid+0.25*K,0.45*cap),Math.max(0.6,(0.7+1.4*A.bass)*dpr),0,crot);
    corona(cx,cy,r0*1.03,unit*(8+34*A.mid)*wob,soft(0.05+0.2*A.mid,0.25*cap),Math.max(0.5,0.6*dpr),311,-crot);
    layer(1.0);
    corona(cx,cy,r0+Lmax*0.98,unit*(10+46*A.bass+20*K)*wob,soft(0.03+0.14*A.bass+0.1*K,0.18*cap),Math.max(0.5,0.6*dpr),617,crot*0.5);


    // sonar rings as rough energy: a wavering haze, a broken bright core and a dust cloud that spreads as it travels.
    // kick = broad gold haze, snare = crackling white haze, hat = a fine ring of dust
    layer(0.85);
    const speed=Smin*0.3, maxR=Math.hypot(W,H)*0.62;
    ctx.lineJoin="round";
    for(let k=RINGS.length-1;k>=0;k--){
      const Rg=RINGS[k], age=(now-Rg.t)/1000, rr=luna*1.02+speed*age;
      if(rr>maxR){ RINGS.splice(k,1); continue; }
      const life=(rr-luna)/(maxR-luna), fade=Math.pow(1-life,1.3)*Math.min(1,age*30+0.3), sp=Rg.s;
      if(Rg.kind==="kick"){
        const a=soft(sp*fade,0.85*cap), amp=unit*(3+16*life)*(0.6+0.6*sp)*wob, band=unit*(3+26*life)*(0.7+0.5*sp);
        // smoke: two wide, faint strokes give the band its body
        for(let h=0;h<2;h++){
          roughRing(cx,cy,rr,amp*1.4,Rg.ph,age+h,2,9,0.6,h+5);
          ctx.strokeStyle="rgba("+rayRGB+","+(a*0.1).toFixed(3)+")"; ctx.lineWidth=band*(2.4-h)+unit*16; ctx.stroke();
        }
        // wisps: thin strands each on their own slice of turbulence, spread across the band
        for(let w=0;w<6;w++){
          const off=(w-2.5)/2.5*band;
          roughRing(cx,cy,rr+off,amp,Rg.ph,age*(1+w*0.13),3,13,1.1+life,w);
          ctx.strokeStyle="rgba("+(w%3===0?rayHot:rayRGB)+","+Math.min(1,a*(0.32-0.035*Math.abs(w-2.5))).toFixed(3)+")";
          ctx.lineWidth=Math.max(0.6,unit*(1.6-life)*(w%3===0?1.4:0.9)); ctx.stroke();
        }
        ringDust(cx,cy,rr,band*1.6+unit*4,Rg,age,a*0.75,unit*(2-life),rayHot);
      } else if(Rg.kind==="snare"){
        const a=soft(sp*fade,0.9*cap), amp=unit*(2.5+12*life)*(0.6+0.6*sp)*wob, band=unit*(2+18*life);
        roughRing(cx,cy,rr,amp*1.3,Rg.ph,age,4,17,0.9,5);
        ctx.strokeStyle="rgba("+boltRGB+","+(a*0.11).toFixed(3)+")"; ctx.lineWidth=band*2+unit*14; ctx.stroke();
        // crackle: broken white strands with fast, fine turbulence
        for(let w=0;w<4;w++){
          ctx.setLineDash([unit*(10+w*4+Rg.ph[w]*2),unit*(3+life*24+w*2),unit*(4+w),unit*(2+life*12)]);
          roughRing(cx,cy,rr+(w-1.5)/1.5*band,amp*1.2,Rg.ph,age*(1.6+w*0.2),5,21,1.6+life,w);
          ctx.strokeStyle="rgba(255,255,255,"+Math.min(1,a*(0.58-0.08*w)).toFixed(3)+")"; ctx.lineWidth=Math.max(0.6,unit*(1.1-0.4*life)); ctx.stroke();
        }
        ctx.setLineDash([]);
        ringDust(cx,cy,rr,band*1.5+unit*3,Rg,age,a*0.7,unit*(1.6-0.7*life),"255,255,255");
      } else {
        const a=soft(sp*fade,0.7*cap);
        ringDust(cx,cy,rr,unit*(3+30*life),Rg,age,a*0.75,unit*1.3,rayHot);
        roughRing(cx,cy,rr,unit*(2+10*life)*wob,Rg.ph,age,4,20,0.8);
        ctx.strokeStyle="rgba("+rayHot+","+(a*0.06).toFixed(3)+")"; ctx.lineWidth=unit*8; ctx.stroke();
      }
    }

    layer(0.3);
    // ornament ticks just outside the luna, lit by the treble
    ctx.beginPath();
    const TK=NR*2;
    for(let i=0;i<TK;i++){ const a=i*2*Math.PI/TK, c1=Math.cos(a), s1=Math.sin(a), e2=1.065+(i%2?0:0.022);
      ctx.moveTo(cx+c1*luna*1.035,cy+s1*luna*1.035); ctx.lineTo(cx+c1*luna*e2,cy+s1*luna*e2); }
    ctx.strokeStyle="rgba("+rayRGB+","+soft(0.16+0.5*Math.min(1,A.treble),0.6).toFixed(3)+")"; ctx.lineWidth=Math.max(0.5,0.7*dpr); ctx.stroke();

    // the luna window and the vessel inside it, set just behind the frame
    layer(0.15);
    ctx.globalCompositeOperation="source-over";
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,luna*0.985,0,Math.PI*2); ctx.clip();
    ctx.fillStyle="rgba(4,4,6,0.88)"; ctx.fillRect(cx-luna,cy-luna,luna*2,luna*2);
    ctx.globalCompositeOperation="lighter";
    const D=(luna*0.93)/0.36, x0=cx-D/2, y0=cy-D/2;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(vcan,x0,y0,D,D);
    ctx.globalAlpha=soft(0.15+0.35*A.bass+0.25*K,0.32*G); ctx.drawImage(b1,x0,y0,D,D);
    ctx.restore();
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=soft(0.1+0.25*A.bass+0.3*K,0.26*G);
    ctx.drawImage(b2,x0-D*0.06,y0-D*0.06,D*1.12,D*1.12);
    ctx.globalAlpha=1;

    // rings
    layer(0.3);
    ctx.beginPath(); ctx.arc(cx,cy,luna,0,Math.PI*2);
    ctx.strokeStyle="rgba("+rayHot+","+(0.6+soft(0.4*K,0.3)).toFixed(3)+")"; ctx.lineWidth=(1.2+soft(1.8*K,1.4))*dpr; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,luna*1.105,0,Math.PI*2);
    ctx.strokeStyle="rgba("+rayRGB+",0.38)"; ctx.lineWidth=0.8*dpr; ctx.stroke();

    // jewels on the outer ring, each listening to its own band
    const JW=12;
    for(let j=0;j<JW;j++){
      const a=-Math.PI/2+(j+0.5)*2*Math.PI/JW, v=rayVal[Math.round((j+0.5)*NR/JW)%NR];
      const jr=Smin*0.0048*(1+1.1*Math.max(0,v)), x=cx+Math.cos(a)*luna*1.105, y=cy+Math.sin(a)*luna*1.105;
      const jg=radial(x,y,0,x,y,jr*3.2);
      jg.addColorStop(0,"rgba("+rayHot+","+(0.55+0.45*v).toFixed(3)+")");
      jg.addColorStop(0.35,"rgba("+rayRGB+","+(0.35*v+0.1).toFixed(3)+")");
      jg.addColorStop(1,"rgba("+rayRGB+",0)");
      ctx.fillStyle=jg; ctx.fillRect(x-jr*3.2,y-jr*3.2,jr*6.4,jr*6.4);
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation="source-over";
    ctx.setTransform(1,0,0,1,0,0);
  }

  // ---------- loop ----------
  let plateTick=0;
  function step(now,dt){
    const t=now/1000;
    analyse(dt,t,now);
    // form never rests: the target drifts with energy, beats push it, and the form chases it
    S.mT+=dt*(0.015+0.06*A.energy);
    S.m+=(S.mT-S.m)*Math.min(1,dt*5); A.kickEvent=0;
    // the bass note sets the core's angle: same note, same orientation
    const pt=S.pitch*(2*Math.PI/12)/Math.max(1,S.order/2);
    let dr=pt-S.rot%(2*Math.PI/S.order); dr=Math.atan2(Math.sin(dr*S.order),Math.cos(dr*S.order))/S.order;
    S.rot+=dr*Math.min(1,dt*9);
    HL.punch*=Math.exp(-dt*9); HL.snare*=Math.exp(-dt*8); HL.hat*=Math.exp(-dt*18);
    S.hue=fract(S.hue+dt*0.006);
    if(S.bFast>0) S.bFast-=dt;
    // chaos guard: if the form collapses to a point or a short cycle, move on and ease off the modulation
    S.collapseT=S.cov<0.008?S.collapseT+dt:0;
    if(S.collapseT>0.2){ S.mT=Math.floor(S.mT)+1.5; S.modGain=0.15; S.bFast=0.5; S.collapseT=0; }
    S.modGain=Math.min(1,S.modGain+dt*0.2);
    if(S.autoPal && S.palT>=1 && RT.mode==="idle" && Math.random()<dt/18) nextPalette();
    blendPalette(dt);
    const w0=performance.now();
    accumulate(t); develop(dt);
    const work=performance.now()-w0;
    if(!OFFLINE) splatBudget=clamp(splatBudget*(work>10?0.9:work<6?1.05:1),40000,700000);
    render(t,dt);
    if((plateTick+=dt)>0.5){ plateTick=0; updatePlate(); }
  }

  // ---------- chrome ----------
  const esc=s=>String(s).replace(/[<>&"]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[m]));
  function updatePlate(){
    const src=RT.sourceLabel();
    $("plate").innerHTML="SEED <b>"+esc(S.seed)+"</b><br>"+esc(FAM[S.kind].name)+" · D"+S.order+(S.mirror?"·m":"")+" · "+esc(S.palName.toUpperCase())+"<br>SOURCE <b>"+esc(src)+"</b>";
  }
  $("btnForm").addEventListener("click",()=>newForm());
  $("palette").addEventListener("change",e=>setPalette(e.target.value));

  // ---------- wiring into the shared base, and boot ----------
  goPalette("reliquary",0.01); S.palT=1; blendPalette(0); setPalette("auto");
  const RT=AR.create({
    name:"plutonian-core", canvas:cv, lookahead:0.05,
    analysers:{ level:{fftSize:2048,smoothing:0.7,needs:["freq","time"]} },
    onsets:true, demo:makeDemo, demoName:"Demo hymn", demoGain:0.55, idleName:"Idle, waiting for sound",
    glow:{min:0.25,max:1.2,value:0.7,onChange:v=>{ S.glow=v; }}, glowKeysLegacy:["ostensoria-live-glow"],
    palettes:["auto",...PAL_ORDER],
    keys:{n:()=>newForm()},
    onHit, step,
    onSource:()=>{ A.lastSwitch=OFFLINE?0:performance.now(); if(S.forms) updatePlate(); },
    offlineSetup:(cfg)=>{
      splatBudget=cfg.splats||450000;
      if(cfg.palette && cfg.palette!=="auto"){ setPalette(cfg.palette); $("palette").value=cfg.palette; }
      newForm(cfg.seed||undefined);
      return {seed:S.seed,family:FAM[S.kind].name,order:S.order,core:R};
    }
  });
  if(!OFFLINE) newForm();
  RT.start();
})();
