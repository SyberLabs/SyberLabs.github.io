<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RISE | Live Demo</title>
  <meta name="description" content="Watch RISE turn a text into Stream and Page, then try the browser-based reading experience.">
  <link rel="canonical" href="https://syberlabs.io/rise/">
  <link rel="icon" href="/favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:title" content="RISE | Live Demo">
  <meta property="og:description" content="Watch the RISE Stream-to-Page live demo.">
  <meta property="og:url" content="https://syberlabs.io/rise/">
  <meta property="og:image" content="https://syberlabs.io/rise/poster.jpg">
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#090b12;color:#f3f1eb}
    *{box-sizing:border-box}
    body{margin:0}
    a{color:inherit}
    .shell{width:min(1100px,calc(100% - 40px));margin:auto}
    header{display:flex;align-items:center;justify-content:space-between;padding:25px 0 18px;gap:20px}
    .brand{font-family:Georgia,serif;font-size:1.25rem;font-style:italic;text-decoration:none}
    .back{color:#b9b9c3;font-size:.82rem;text-decoration:none}
    .back:hover,.links a:hover{text-decoration:underline}
    main{padding:36px 0 92px}
    .eyebrow{margin:0 0 12px;color:#d2a474;font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    h1{font-family:Georgia,serif;font-size:clamp(3rem,8vw,6rem);font-weight:400;line-height:1;margin:0 0 12px}
    .intro{color:#b9b9c3;font-size:clamp(1rem,2vw,1.2rem);margin:0 0 28px}
    video{display:block;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #34323b;border-radius:10px}
    .caption{color:#a7a5ae;font-size:.75rem;margin:12px 0 0}
    .below{display:flex;align-items:end;justify-content:space-between;gap:40px;margin-top:54px}
    h2{font-family:Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:400;margin:0 0 14px}
    .below p{max-width:56ch;color:#c3c0c8;line-height:1.7;margin:0}
    .links{display:flex;flex-wrap:wrap;gap:12px;flex-shrink:0}
    .links a{display:inline-block;padding:12px 17px;border:1px solid #786851;border-radius:4px;text-decoration:none;font-size:.8rem}
    .links .primary{background:#d2a474;color:#101014;border-color:#d2a474;font-weight:700}
    footer{border-top:1px solid #282831;color:#92909a;font-size:.75rem;padding:25px 0 40px}
    @media(max-width:700px){main{padding-top:24px}.below{display:block}.links{margin-top:26px}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/">SyberLabs</a>
      <a class="back" href="/">← All work</a>
    </header>
    <main>
      <p class="eyebrow">RISE demo</p>
      <h1>RISE</h1>
      <p class="intro">Watch the Stream-to-Page live demo.</p>
      <video controls playsinline preload="metadata" poster="/rise/poster.jpg" aria-label="RISE Stream-to-Page live demo">
        <source src="/rise/rise-demo.mp4" type="video/mp4">
        Your browser cannot play this video. <a href="/rise/rise-demo.mp4">Download the demo</a>.
      </video>
      <p class="caption">75 seconds · Captured RISE interface · JEV shown as in development</p>
      <div class="below">
        <div>
          <h2>Read in time or space.</h2>
          <p>Stream plays text over time. Page arranges it in space. Your local files stay in your browser.</p>
        </div>
        <div class="links">
          <a href="https://github.com/SyberLabs/RISE">View source ↗</a>
        </div>
      </div>
    </main>
    <footer>© 2026 SyberLabs</footer>
  </div>
</body>
</html>
